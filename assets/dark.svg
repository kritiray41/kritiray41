<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <!-- Dark Background -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <!-- Shimmering Border -->
    <linearGradient id="border-shimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.02)" />
      <stop offset="50%" stop-color="rgba(34, 211, 238, 0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
      <animate attributeName="x1" values="0%;-100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Accent Text Gradient -->
    <linearGradient id="accent-dark" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
      <animate attributeName="x1" values="0%;-100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Heavy Blur for Background Orbs -->
    <filter id="heavy-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1180" height="610" rx="20" fill="url(#bg-dark)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- FLOATING RADIAL GRADIENTS (Background Glow) -->
  <circle cx="200" cy="500" r="150" fill="#7C3AED" opacity="0.15" filter="url(#heavy-blur)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 40,-60; 0,0" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="100" r="200" fill="#22D3EE" opacity="0.1" filter="url(#heavy-blur)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -50,50; 0,0" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- SCANLINE SWEEP -->
  <rect width="1180" height="8" fill="rgba(34, 211, 238, 0.05)">
    <animate attributeName="y" values="-10;620" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- LEFT SIDE: Floating Animated ASCII -->
  <g transform="translate(80, 150)" font-family="monospace" font-size="14" fill="url(#accent-dark)" font-weight="bold">
    <!-- Base text with slight fade animation -->
    <g>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
      <text y="0">██╗  ██╗██████╗ ██╗████████╗██╗</text>
      <text y="25">██║ ██╔╝██╔══██╗██║╚══██╔══╝██║</text>
      <text y="50">█████╔╝ ██████╔╝██║   ██║   ██║</text>
      <text y="75">██╔═██╗ ██╔══██╗██║   ██║   ██║</text>
      <text y="100">██║  ██╗██║  ██║██║   ██║   ██║</text>
      <text y="125">╚═╝  ╚═╝╚═╝  ╚═╝╚═╝   ╚═╝   ╚═╝</text>
      <text y="180" opacity="0.7">██████╗  █████╗ ██╗   ██╗</text>
      <text y="205" opacity="0.7">██╔══██╗██╔══██╗╚██╗ ██╔╝</text>
      <text y="230" opacity="0.7">██████╔╝███████║ ╚████╔╝ </text>
      <text y="255" opacity="0.7">██╔══██╗██╔══██║  ╚██╔╝  </text>
      <text y="280" opacity="0.7">██║  ██║██║  ██║   ██║   </text>
      <text y="305" opacity="0.7">╚═╝  ╚═╝╚═╝  ╚═╝   ╚═╝   </text>
    </g>
    <!-- Floating animation for the entire ASCII block -->
    <animateTransform attributeName="transform" type="translate" values="80,150; 80,140; 80,150" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- RIGHT SIDE: Terminal Window -->
  <rect x="450" y="50" width="680" height="510" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="url(#border-shimmer)" stroke-width="2" />
  
  <!-- Terminal Header Dots -->
  <circle cx="475" cy="75" r="6" fill="#EF4444" />
  <circle cx="495" cy="75" r="6" fill="#F59E0B" />
  <circle cx="515" cy="75" r="6" fill="#10B981" />
  <line x1="450" y1="100" x2="1130" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Text Content -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="490" y="160" font-size="32" fill="#F8FAFC" font-weight="bold">Hi 👋</text>
    <text x="490" y="215" font-size="48" fill="#F8FAFC" font-weight="900">I'm Kriti Ray</text>
    
    <!-- SEQUENTIAL ANIMATED TYPING TEXT -->
    <g transform="translate(490, 270)" font-size="24" fill="url(#accent-dark)" font-weight="600" font-family="monospace">
      <!-- Role 1 -->
      <text opacity="0">
        &gt; Computer Science Student
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <!-- Role 2 -->
      <text opacity="0">
        &gt; Flutter Developer
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" dur="9s" repeatCount="indefinite"/>
      </text>
      <!-- Role 3 -->
      <text opacity="0">
        &gt; Machine Learning Learner
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite"/>
      </text>
      <!-- Persistent Blinking Cursor on the next line -->
      <text y="2" x="0" opacity="0">
        <tspan fill="#22D3EE">_</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Details -->
    <text x="490" y="330" font-size="18" fill="#94A3B8">📍 Based in India</text>
    <text x="490" y="370" font-size="18" fill="#94A3B8">🎓 Learning Advanced DSA &amp; Machine Learning</text>
    <text x="490" y="410" font-size="18" fill="#94A3B8">🔭 Currently working on Open Source &amp; Weather Reporter</text>

    <!-- Glowing Skills Pills (with subtle pulse animation) -->
    <g transform="translate(490, 460)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
      <!-- Pill 1 -->
      <rect x="0" y="0" width="80" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="url(#accent-dark)"/>
      <text x="40" y="21" font-size="14" fill="#F8FAFC" text-anchor="middle">C/C++</text>
      <!-- Pill 2 -->
      <rect x="95" y="0" width="85" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="url(#accent-dark)"/>
      <text x="137" y="21" font-size="14" fill="#F8FAFC" text-anchor="middle">Python</text>
      <!-- Pill 3 -->
      <rect x="195" y="0" width="85" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="url(#accent-dark)"/>
      <text x="237" y="21" font-size="14" fill="#F8FAFC" text-anchor="middle">Flutter</text>
      <!-- Pill 4 -->
      <rect x="295" y="0" width="70" height="32" rx="16" fill="rgba(255,255,255,0.05)" stroke="url(#accent-dark)"/>
      <text x="330" y="21" font-size="14" fill="#F8FAFC" text-anchor="middle">Git</text>
    </g>
  </g>
</svg>
